<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悠靈の小站</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    
    <div id="navbar"></div>
    
    <h1 style="text-align:center;">首頁</h1>
    
    <div class="card">
      <h2>我的網站</h2>
      <p>歡迎來到我的 GitHub Pages</p>
    </div>

    <div id="login-modal" class="card" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; width: 300px;">
      <h3>帳號登入</h3>
      <input type="email" id="email" placeholder="電子信箱" style="width: 100%; margin-bottom: 10px; padding: 8px;">
      <input type="password" id="password" placeholder="密碼" style="width: 100%; margin-bottom: 10px; padding: 8px;">
      <div style="display: flex; gap: 10px;">
        <button id="do-login" class="nav-btn" style="background: rgba(0, 128, 0, 0.4);">登入</button>
        <button id="do-signup" class="nav-btn">註冊</button>
        <button id="close-modal" class="nav-btn" style="background: rgba(128, 0, 0, 0.4);">取消</button>
      </div>
    </div>
    
    <script src="/js/main.js"></script>
  </body>
</html>
