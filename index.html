<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta name="google-site-verification" content="YaWAhnHs4iXK2H6gBSxX4aFVTFDrpFEr-IXdvPPkh5A" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悠靈の小站</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    
    <div id="navbar"></div>
    
    <h1 style="text-align:center;">首頁</h1>
    
    <div class="card">
      <h2>我的網站</h2>
      <p>歡迎來到我的 GitHub Pages</p>
    </div>

    <main>
      <section class="card">
        <h2>關於 悠靈の小站</h2>
        <p>
          悠靈の小站是一個個人化的平台，對，就是如此 
        </p>
      </section>
    </main>

    <footer style="text-align: center; padding: 20px; color: rgba(255,255,255,0.5); font-size: 14px;">
      <p>&copy; 2024 悠靈の小站</p>
      <a href="/privacy.html" style="color: rgba(255,255,255,0.7); text-decoration: underline;">隱私權政策</a>
    </footer>
    
    <script src="/js/main.js"></script>


    <div id="auth-modal" class="modal-overlay">
      <div class="modal-content card">
        <button class="close-modal" id="close-modal">x</button>
    
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">登入</button>
          <button class="auth-tab" data-tab="register">註冊</button>
        </div>

        <div id="login-form-container" class="auth-form-content">
          <div class="query-form">
            <input type="email" id="login-email" placeholder="電子郵件">
            <input type="password" id="login-password" placeholder="密碼">
            <button id="login-submit-btn">進入小站</button>
            <div class="divider"><span>或</span></div>
            <button id="google-login-btn" class="social-btn">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
              Google 快速登入
            </button>
          </div>
        </div>

        <div id="register-form-container" class="auth-form-content" style="display: none;">
          <div class="query-form">
            <input type="text" id="reg-name" placeholder="使用者暱稱">
            <input type="email" id="reg-email" placeholder="電子郵件">
            <input type="password" id="reg-password" placeholder="設定密碼">
            <button id="register-submit-btn">建立帳號</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
