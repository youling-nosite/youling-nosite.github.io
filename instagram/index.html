<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instgram</title>
    
    <!-- 引入 Tailwind CSS (負責排版與樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 核心庫 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel 以在瀏覽器中即時編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 隱藏限時動態區塊的滾動條 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 防止雙擊圖片時選取到文字 */
        .select-none { user-select: none; }

        /* 留言區滑動動畫 */
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- React 應用的掛載點 -->
    <div id="root"></div>

    <!-- 所有的 React 程式碼直接寫在這裡 -->
    <script type="text/babel">
        const { useState } = React;

        // --- 1. 內建 SVG 圖示元件 ---
        const Heart = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill={className?.includes('fill-red') ? "currentColor" : "none"} strokeLinecap="round" strokeLinejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
            </svg>
        );
        const MessageCircle = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
        );
        const Send = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
        );
        const Bookmark = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
        );
        const MoreHorizontal = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" />
            </svg>
        );
        const Home = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        );
        const Search = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
        );
        const PlusSquare = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="12" y1="8" x2="12" y2="16" /><line x1="8" y1="12" x2="16" y2="12" />
            </svg>
        );
        const Video = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
            </svg>
        );
        const Plus = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" />
            </svg>
        );
        const ArrowLeft = ({ className, onClick }) => (
            <svg className={className} onClick={onClick} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        );

        // --- 2. 初始假資料 ---
        const storiesData = [
            { id: 1, username: 'user_1', avatar: 'https://i.pravatar.cc/150?img=32' },
            { id: 2, username: 'user_2', avatar: 'https://i.pravatar.cc/150?img=12' },
            { id: 3, username: 'user_3', avatar: 'https://i.pravatar.cc/150?img=5' },
            { id: 4, username: 'user_4', avatar: 'https://i.pravatar.cc/150?img=20' }
        ];

        const initialPosts = [
            {
                id: 1,
                author: 'mystake_417',
                avatar: '/assets/images/mystake_417.jpg',
                image: '/assets/images/post0.png',
                likes: 20,
                isLiked: false,
                caption: `好久沒好好畫了~\n貓看著的時候,好像整個人都變得柔軟了\n那表情連貓都看穿了૮꒰˶ฅ́˘ฅ̀˶꒱ა\n\n（今天要畫的時候訊息一直來 ヽ(#\`Д´)ノ`,
                date: '7月23日',
                comments: [
                    
                ]
            },
            {
                id: 2,
                author: '999651love',
                avatar: '/assets/images/999651love.jpg',
                image: '/assets/images/post1.png',
                likes: 102,
                isLiked: false,
                caption: `10/31\n-\n-\n-\n我想自己發一個啦啦啦`,
                date: '11月1日',
                comments: [
                  { username: 'yms__0201', avatar: '/assets/images/yms__0201.jpg', text: '第一張傳給我，媽爺拍得真好' }
                ]
            },
            {
                id: 3,
                author: 'mystake_417',
                avatar: '/assets/images/mystake_417.jpg',
                image: '/assets/images/post2.png',
                likes: 20,
                isLiked: false,
                caption: `想畫點帥帥的地雷系（？）\n結果不小心畫太順(σ°∀°)σ\n黑色好好塗,表情也意外地對味\n避難所就這樣\n多了一個不太好惹的傢伙ت\n\n（gpt說整體有一種「安靜但會咬人」的帥感🤣`,
                date: '7月31日',
                comments: [
                    
                ]
            }
        ];

        // --- 2.5 留言區彈出視窗元件 ---
        const CommentsModal = ({ post, onClose, onComment }) => {
            const [text, setText] = useState('');

            const handleSubmit = () => {
                if (text.trim()) {
                    onComment(post.id, text);
                    setText('');
                }
            };

            return (
                <div className="absolute inset-0 z-[60] bg-black/40 animate-fade-in flex flex-col justify-end">
                    {/* 點擊黑色半透明背景可關閉留言區 */}
                    <div className="flex-1 w-full" onClick={onClose}></div>
                    
                    {/* 底部彈窗主體 */}
                    <div className="bg-white w-full h-[80%] rounded-t-2xl flex flex-col animate-slide-up shadow-xl overflow-hidden">
                        {/* 頂部把手與標題 */}
                        <div className="flex flex-col items-center pt-3 pb-3 border-b border-gray-200 bg-white">
                            <div className="w-10 h-1.5 bg-gray-300 rounded-full mb-3"></div>
                            <h2 className="text-center font-bold text-[15px]">留言</h2>
                        </div>
                        
                        {/* 留言列表 */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-5 bg-white">
                            {/* 貼文作者自己的內文 */}
                            <div className="flex space-x-3 pb-4 border-b border-gray-100">
                                <img src={post.avatar} className="w-8 h-8 rounded-full object-cover flex-shrink-0" alt="author" />
                                <div>
                                    <span className="font-semibold text-sm mr-2">{post.author}</span>
                                    <span className="text-sm whitespace-pre-wrap">{post.caption}</span>
                                    <div className="text-[12px] text-gray-500 mt-1">{post.date}</div>
                                </div>
                            </div>
                            
                            {/* 其他人的留言 */}
                            {post.comments.length === 0 && (
                                <div>
                                  <h2 className="text-center text-gray-500 text-sm py-4">尚無留言</h2>
                                  <p className="text-center text-gray-500 text-sm py-4">開始對話。</p>
                                </div>
                            )}
                            {post.comments.map((c, i) => (
                                <div key={i} className="flex space-x-3">
                                    <img src={c.avatar} className="w-8 h-8 rounded-full object-cover flex-shrink-0" alt={c.username} />
                                    <div className="flex-1">
                                        <span className="font-semibold text-sm mr-2">{c.username}</span>
                                        <span className="text-sm">{c.text}</span>
                                        <div className="text-[12px] text-gray-500 mt-1">剛剛 回覆</div>
                                    </div>
                                    <Heart className="w-4 h-4 text-gray-400 cursor-pointer flex-shrink-0 mt-1" />
                                </div>
                            ))}
                        </div>

                        {/* 輸入新留言區塊 */}
                        <div className="p-3 border-t border-gray-200 flex items-center space-x-3 bg-white pb-6">
                            <img src="https://i.pravatar.cc/150?img=11" alt="我的頭像" className="w-8 h-8 rounded-full object-cover" />
                            <input
                                type="text"
                                className="flex-1 outline-none text-sm bg-gray-100 rounded-full px-4 py-2"
                                placeholder="新增留言..."
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleSubmit()}
                            />
                            <button
                                className={`text-sm font-semibold transition-colors ${text.trim() ? 'text-blue-500' : 'text-blue-200'}`}
                                disabled={!text.trim()}
                                onClick={handleSubmit}
                            >
                                發佈
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3. 單篇貼文元件 ---
        const Post = ({ post, onLike, onComment, onOpenComments }) => {
            const [commentText, setCommentText] = useState('');
            const [isLiking, setIsLiking] = useState(false);

            const handleLikeClick = () => {
                setIsLiking(true);
                onLike(post.id);
                setTimeout(() => setIsLiking(false), 200); 
            };

            const handleDoubleTap = (e) => {
                if (!post.isLiked) {
                    handleLikeClick();
                }
            };

            const submitComment = () => {
                if (commentText.trim()) {
                    onComment(post.id, commentText);
                    setCommentText('');
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    submitComment();
                }
            };

            return (
                <article className="mb-4 border-b border-gray-200 pb-2 bg-white">
                    <div className="flex items-center justify-between px-3 py-2">
                        <div className="flex items-center">
                            <div className="bg-gradient-to-tr from-yellow-400 via-red-500 to-fuchsia-600 p-[2px] rounded-full mr-2">
                                <div className="bg-white p-[2px] rounded-full">
                                    <img src={post.avatar} alt="頭像" className="w-8 h-8 rounded-full object-cover" />
                                </div>
                            </div>
                            <span className="font-semibold text-sm">{post.author}</span>
                        </div>
                        <MoreHorizontal className="text-gray-900 w-5 h-5 cursor-pointer" />
                    </div>

                    <div className="relative w-full bg-gray-50 select-none cursor-pointer" onDoubleClick={handleDoubleTap}>
                        <img 
                            src={post.image} 
                            alt="貼文圖片" 
                            className="w-full h-auto object-cover max-h-[600px]" 
                            onError={(e) => { e.target.src = 'https://via.placeholder.com/400x500?text=圖片載入失敗'; }}
                        />
                    </div>

                    <div className="flex items-center justify-between px-3 py-3">
                        <div className="flex items-center space-x-5">
                            <button onClick={handleLikeClick} className="flex items-center space-x-1 outline-none">
                                <div className={`transition-transform ${isLiking ? 'scale-125' : 'scale-100'}`}>
                                    <Heart className={`w-6 h-6 ${post.isLiked ? 'fill-red-500 text-red-500' : 'text-gray-900'}`} />
                                </div>
                                <span className="text-sm font-semibold text-gray-800">{post.likes.toLocaleString()}</span>
                            </button>
                            <button onClick={() => onOpenComments(post.id)} className="flex items-center space-x-1 outline-none">
                                <MessageCircle className="w-6 h-6 text-gray-900" />
                                <span className="text-sm font-semibold text-gray-800">{post.comments.length}</span>
                            </button>
                            <button><Send className="w-6 h-6 text-gray-900" /></button>
                        </div>
                        <button><Bookmark className="w-6 h-6 text-gray-900" /></button>
                    </div>

                    <div className="px-3 text-sm mb-1 mt-1">
                        <span className="font-semibold mr-2">{post.author}</span>
                        <span className="whitespace-pre-wrap">{post.caption}</span>
                    </div>

                    <div className="px-3 text-[10px] text-gray-500 uppercase mt-2 mb-3 tracking-wide">
                        {post.date}
                    </div>

                    <div className="flex items-center px-3 py-2 border-t border-gray-100">
                        <img src="https://i.pravatar.cc/150?img=11" alt="我的頭像" className="w-7 h-7 rounded-full object-cover mr-3 flex-shrink-0" />
                        <input
                            type="text"
                            placeholder="新增留言..."
                            className="flex-1 bg-transparent outline-none text-sm placeholder-gray-500"
                            value={commentText}
                            onChange={(e) => setCommentText(e.target.value)}
                            onKeyDown={handleKeyPress}
                        />
                        <button
                            className={`text-sm font-semibold ml-2 transition-colors ${commentText.trim() ? 'text-blue-500' : 'text-blue-200'}`}
                            disabled={!commentText.trim()}
                            onClick={submitComment}
                        >
                            發佈
                        </button>
                    </div>
                </article>
            );
        };

        // --- 4. 主應用程式元件 ---
        const App = () => {
            const [posts, setPosts] = useState(initialPosts);
            const [activeCommentPostId, setActiveCommentPostId] = useState(null);

            const handleLike = (postId) => {
                setPosts(currentPosts => 
                    currentPosts.map(post => {
                        if (post.id === postId) {
                            const isCurrentlyLiked = post.isLiked;
                            return {
                                ...post,
                                isLiked: !isCurrentlyLiked,
                                likes: isCurrentlyLiked ? post.likes - 1 : post.likes + 1
                            };
                        }
                        return post;
                    })
                );
            };

            const handleComment = (postId, text) => {
                setPosts(currentPosts => 
                    currentPosts.map(post => {
                        if (post.id === postId) {
                            return {
                                ...post,
                                comments: [...post.comments, { 
                                    username: 'my_account', 
                                    avatar: 'https://i.pravatar.cc/150?img=11',
                                    text: text 
                                }]
                            };
                        }
                        return post;
                    })
                );
            };

            const activePost = posts.find(p => p.id === activeCommentPostId);

            return (
                <div className="bg-gray-100 min-h-screen flex justify-center font-sans">
                    <div className="w-full max-w-[414px] bg-white h-full min-h-screen relative shadow-sm flex flex-col pb-12 border-x border-gray-200 overflow-hidden">
                        
                        {/* 留言區彈出視窗 */}
                        {activePost && (
                            <CommentsModal 
                                post={activePost} 
                                onClose={() => setActiveCommentPostId(null)} 
                                onComment={handleComment} 
                            />
                        )}

                        <header className="sticky top-0 z-40 bg-white border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                            <div className="font-serif italic text-2xl font-bold tracking-tight pt-1">
                                Instagram
                            </div>
                            <div className="flex space-x-4">
                                <Heart className="w-6 h-6 text-gray-900 cursor-pointer" />
                                <MessageCircle className="w-6 h-6 text-gray-900 cursor-pointer" />
                            </div>
                        </header>

                        <div className="border-b border-gray-200 py-3 px-2 flex space-x-4 overflow-x-auto scrollbar-hide bg-white">
                            <div className="flex flex-col items-center space-y-1 ml-2">
                                <div className="relative cursor-pointer">
                                    <img src="https://i.pravatar.cc/150?img=11" alt="我的限時動態" className="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm" />
                                    <div className="absolute bottom-0 right-0 bg-blue-500 rounded-full border-2 border-white flex items-center justify-center w-5 h-5">
                                        <Plus className="w-3 h-3 text-white stroke-[3]" />
                                    </div>
                                </div>
                                <span className="text-xs text-gray-600">你的限時動態</span>
                            </div>
                            {storiesData.map((story) => (
                                <div key={story.id} className="flex flex-col items-center space-y-1 cursor-pointer">
                                    <div className="bg-gradient-to-tr from-yellow-400 via-red-500 to-fuchsia-600 p-[2px] rounded-full">
                                        <div className="bg-white p-[2px] rounded-full">
                                            <img src={story.avatar} alt={story.username} className="w-[58px] h-[58px] rounded-full object-cover" />
                                        </div>
                                    </div>
                                    <span className="text-xs text-gray-600">{story.username}</span>
                                </div>
                            ))}
                        </div>

                        <main className="flex-1 overflow-y-auto bg-gray-100">
                            {posts.map(post => (
                                <Post 
                                    key={post.id} 
                                    post={post} 
                                    onLike={handleLike} 
                                    onComment={handleComment} 
                                    onOpenComments={(id) => setActiveCommentPostId(id)}
                                />
                            ))}
                            
                            <div className="h-10 text-center text-gray-400 py-4 text-sm font-medium bg-gray-100">
                                ✔ 你已經看完全部貼文
                            </div>
                        </main>

                        <nav className="fixed bottom-0 w-full max-w-[414px] bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center z-40">
                            <Home className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <Search className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <PlusSquare className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <Video className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <img src="https://i.pravatar.cc/150?img=11" alt="個人檔案" className="w-7 h-7 rounded-full object-cover border border-gray-300 p-[1px] cursor-pointer" />
                        </nav>
                        
                    </div>
                </div>
            );
        };

        // --- 5. 渲染應用程式 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
