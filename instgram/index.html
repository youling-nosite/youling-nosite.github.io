        /* 隱藏限時動態區塊的滾動條 */

        /* 防止雙擊圖片時選取到文字 */

        /* 留言區滑動動畫 */

            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }

        // --- 2.5 留言區彈出視窗元件 (完全獨立的組件) ---
        const CommentsModal = ({ post, onClose, onComment }) => {
            const [text, setText] = useState('');

            const handleSubmit = () => {
                if (text.trim()) {
                    onComment(post.id, text);
                    setText('');

                <div className="absolute inset-0 z-[60] bg-black/40 animate-fade-in flex flex-col justify-end">

                        </div>

        // --- 3. 單篇貼文元件 ---
        const Post = ({ post, onLike, onComment, onOpenComments }) => {
            const [commentText, setCommentText] = useState('');
            const [isLiking, setIsLiking] = useState(false);
            
            // --- 多張圖片邏輯 (新增) ---
            const isMultiImage = Array.isArray(post.image);
            const [currentImageIndex, setCurrentImageIndex] = useState(0);

            // 處理滑動時更新目前的圖片索引
            const handleScroll = (e) => {
                if (!isMultiImage) return;
                const scrollLeft = e.target.scrollLeft;
                const width = e.target.clientWidth;
                // 計算目前滑動到第幾張 (四捨五入)
                const newIndex = Math.round(scrollLeft / width);
                if (newIndex !== currentImageIndex) {
                    setCurrentImageIndex(newIndex);
                }
            };

            const handleLikeClick = () => {
                setIsLiking(true);
                onLike(post.id);
                setTimeout(() => setIsLiking(false), 200); 
            };

            const handleDoubleTap = (e) => {
                if (!post.isLiked) {
                    handleLikeClick();
                }
            };

            const submitComment = () => {
                if (commentText.trim()) {
                    onComment(post.id, commentText);
                    setCommentText('');
                }
            };

            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    submitComment();
                }
            };

            return (
                <article className="mb-4 border-b border-gray-200 pb-2 bg-white">
                    <div className="flex items-center justify-between px-3 py-2">
                        <div className="flex items-center">

                                    <img src={post.avatar} alt="頭像" className="w-8 h-8 min-w-[32px] min-h-[32px] rounded-full object-cover flex-shrink-0" onError={(e) => { e.target.src = 'https://via.placeholder.com/32'; }} />
                                </div>
                            </div>
                            <span className="font-semibold text-sm">{post.author}</span>
                        </div>
                        <MoreHorizontal className="text-gray-900 w-5 h-5 cursor-pointer" />
                    </div>

                    {/* --- 圖片展示區塊 (支援多圖輪播) --- */}
                    <div className="relative w-full bg-gray-50 select-none cursor-pointer" onDoubleClick={handleDoubleTap}>
                        {isMultiImage ? (
                            <>
                                <div 
                                    className="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide"
                                    onScroll={handleScroll}
                                >
                                    {post.image.map((imgUrl, index) => (
                                        <img 
                                            key={index}
                                            src={imgUrl} 
                                            alt={`貼文圖片 ${index + 1}`} 
                                            className="w-full shrink-0 snap-center h-auto object-cover max-h-[600px]" 
                                            onError={(e) => { e.target.src = `https://via.placeholder.com/400x500?text=圖片${index + 1}載入失敗`; }}
                                        />
                                    ))}
                                </div>
                                
                                {/* 圖片數量標籤 (右上角) */}
                                <div className="absolute top-3 right-3 bg-black/60 text-white text-xs font-medium px-2 py-1 rounded-full pointer-events-none">
                                    {currentImageIndex + 1}/{post.image.length}
                                </div>
                            </>
                        ) : (
                            <img 
                                src={post.image} 
                                alt="貼文圖片" 
                                className="w-full h-auto object-cover max-h-[600px]" 
                                onError={(e) => { e.target.src = 'https://via.placeholder.com/400x500?text=圖片載入失敗'; }}
                            />
                        )}
                    </div>

                    <div className="flex items-center justify-between px-3 py-3">
                        <div className="flex items-center space-x-5">
                            <button onClick={handleLikeClick} className="flex items-center space-x-1 outline-none">
                                <div className={`transition-transform ${isLiking ? 'scale-125' : 'scale-100'}`}>
                                    <Heart className={`w-6 h-6 ${post.isLiked ? 'fill-red-500 text-red-500' : 'text-gray-900'}`} />
                                </div>
                            </button>
                            <button onClick={() => onOpenComments(post.id)} className="flex items-center space-x-1 outline-none">
                                <MessageCircle className="w-6 h-6 text-gray-900" />
                            </button>
                            <button><Send className="w-6 h-6 text-gray-900" /></button>
                        </div>

                        {/* --- 顯示多張圖片的切換圓點 (置中) --- */}
                        {isMultiImage && (
                            <div className="flex space-x-1 absolute left-1/2 transform -translate-x-1/2">
                                {post.image.map((_, index) => (
                                    <div 
                                        key={index} 
                                        className={`w-1.5 h-1.5 rounded-full transition-colors ${index === currentImageIndex ? 'bg-blue-500' : 'bg-gray-300'}`}
                                    />
                                ))}
                            </div>
                        )}

                        <button><Bookmark className="w-6 h-6 text-gray-900" /></button>
                    </div>

                    {/* 讚數 */}
                    <div className="px-3 text-sm font-semibold mb-1">
                        {post.likes.toLocaleString()} 個讚
                    </div>

                    <div className="px-3 text-sm mb-1 mt-1">
                        <span className="font-semibold mr-2">{post.author}</span>
                        <span className="whitespace-pre-wrap">{post.caption}</span>
                    </div>
                    
                    {/* 查看所有留言的按鈕 */}
                    <button 
                        className="px-3 text-[13px] text-gray-500 mt-1 outline-none text-left w-full"
                        onClick={() => onOpenComments(post.id)}

                        查看全部 {post.displayCommentCount !== undefined ? post.displayCommentCount : post.comments.length} 則留言
                    </button>

                    <div className="px-3 text-[10px] text-gray-500 uppercase mt-2 mb-3 tracking-wide">
                        {post.date}
                    </div>

                    <div className="flex items-center px-3 py-2 border-t border-gray-100">

                        <button
                            className={`text-sm font-semibold ml-2 transition-colors ${commentText.trim() ? 'text-blue-500' : 'text-blue-200'}`}
                            disabled={!commentText.trim()}
                            onClick={submitComment}
                        >
                            發佈
                        </button>
                    </div>
                </article>
            );
        };

        // --- 4. 主應用程式元件 ---
        const App = () => {
            const [posts, setPosts] = useState(initialPosts);
            const [activeCommentPostId, setActiveCommentPostId] = useState(null);

            const handleLike = (postId) => {
                setPosts(currentPosts => 
                    currentPosts.map(post => {
                        if (post.id === postId) {
                            const isCurrentlyLiked = post.isLiked;
                            return {
                                ...post,
                                isLiked: !isCurrentlyLiked,
                                likes: isCurrentlyLiked ? post.likes - 1 : post.likes + 1
                            };
                        }
                        return post;
                    })
                );
            };

            const handleComment = (postId, text) => {
                setPosts(currentPosts => 
                    currentPosts.map(post => {
                        if (post.id === postId) {
                            return {
                                ...post,
                                displayCommentCount: post.displayCommentCount !== undefined ? post.displayCommentCount + 1 : undefined,
                                comments: [...post.comments, { 
                                    username: 'myself', 
                                    avatar: '/assets/images/myself.jpg',
                                    text: text 
                                }]
                            };
                        }
                        return post;
                    })
                );
            };

            const activePost = posts.find(p => p.id === activeCommentPostId);

            return (
                <div className="bg-gray-100 h-[100dvh] w-full flex justify-center font-sans overflow-hidden">
                    <div className="w-full max-w-[414px] bg-white h-full relative shadow-sm flex flex-col border-x border-gray-200 overflow-hidden">
                        
                        {/* 留言區彈出視窗 */}
                        {activePost && (
                            <CommentsModal 
                                post={activePost} 
                                onClose={() => setActiveCommentPostId(null)} 
                                onComment={handleComment} 
                            />
                        )}

                        <header className="bg-white border-b border-gray-200 px-4 py-2 flex justify-between items-center shrink-0">
                            <div className="font-serif italic text-2xl font-bold tracking-tight pt-1">
                                Intergram
                            </div>
                            <div className="flex space-x-4">
                                <Heart className="w-6 h-6 text-gray-900 cursor-pointer" />
                                <MessageCircle className="w-6 h-6 text-gray-900 cursor-pointer" />
                            </div>
                        </header>

                        {/* main 是唯一的滾動區域 */}
                        <main className="flex-1 overflow-y-auto bg-gray-100">
                            <div className="border-b border-gray-200 py-3 px-2 flex space-x-4 overflow-x-auto scrollbar-hide bg-white shrink-0">
                                <div className="flex flex-col items-center space-y-1 ml-2 flex-shrink-0">
                                    <div className="relative cursor-pointer flex-shrink-0">
                                        <img src="/assets/images/myself.jpg" alt="我的限時動態" className="w-16 h-16 min-w-[64px] min-h-[64px] rounded-full object-cover flex-shrink-0 border-2 border-white shadow-sm" onError={(e) => { e.target.src = 'https://via.placeholder.com/64'; }} />
                                        <div className="absolute bottom-0 right-0 bg-blue-500 rounded-full border-2 border-white flex items-center justify-center w-5 h-5">
                                            <Plus className="w-3 h-3 text-white stroke-[3]" />
                                        </div>
                                    </div>
                                    <span className="text-xs text-gray-600">你的限時動態</span>
                                </div>
                                {storiesData.map((story) => (
                                    <div key={story.id} className="flex flex-col items-center space-y-1 cursor-pointer flex-shrink-0">
                                        <div className="bg-gradient-to-tr from-yellow-400 via-red-500 to-fuchsia-600 p-[2px] rounded-full flex-shrink-0">
                                            <div className="bg-white p-[2px] rounded-full flex-shrink-0">
                                                <img src={story.avatar} alt={story.username} className="w-[58px] h-[58px] min-w-[58px] min-h-[58px] rounded-full object-cover flex-shrink-0" onError={(e) => { e.target.src = 'https://via.placeholder.com/58'; }} />
                                            </div>
                                        </div>
                                        <span className="text-xs text-gray-600">{story.username}</span>
                                    </div>
                                ))}
                            </div>

                            {posts.map(post => (
                                <Post 
                                    key={post.id} 
                                    post={post} 
                                    onLike={handleLike} 
                                    onComment={handleComment} 
                                    onOpenComments={(id) => setActiveCommentPostId(id)}
                                />
                            ))}
                            
                            <div className="h-10 text-center text-gray-400 py-4 text-sm font-medium bg-gray-100">
                                {/* Bottom padding space */}
                            </div>
                        </main>

                        <nav className="w-full bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center shrink-0">
                            <Home className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <Search className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <PlusSquare className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <Video className="w-6 h-6 text-gray-900 cursor-pointer" />
                            <img src="/assets/images/myself.jpg" alt="個人檔案" className="w-7 h-7 min-w-[28px] min-h-[28px] rounded-full object-cover flex-shrink-0 border border-gray-300 p-[1px] cursor-pointer" onError={(e) => { e.target.src = 'https://via.placeholder.com/28'; }} />
                        </nav>
                        
                    </div>
                </div>
            );
        };

        // --- 5. 渲染應用程式 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
