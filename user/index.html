<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人設定 - 悠靈の小站</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <h1 style="text-align:center; margin: 40px 0;">個人中心</h1>

        <div class="card user-panel" style="max-width: 600px; margin: 0 auto;">
            <div class="user-header">
                <div class="large-avatar" id="big-avatar"></div>
                <input type="text" id="avatar-url-input" placeholder="貼上新頭像圖片網址" class="edit-input" style="margin-top:10px; font-size: 12px;">
                
                <div style="margin-top: 15px;">
                    <input type="text" id="edit-name" class="edit-input name-input-large" placeholder="輸入新暱稱">
                    <p id="display-email" style="opacity: 0.6; margin-top: 5px;"></p>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">

            <div class="user-details">
                <div class="info-group">
                    <label>帳號連結狀態</label>
                    <div class="status-box">
                        <span>Google 帳號</span>
                        <button id="bind-google-btn" class="social-btn mini-btn">檢查中...</button>
                    </div>
                </div>
                
                <div class="info-group">
                    <label>使用者唯一 ID</label>
                    <div class="info-value" id="display-id">---</div>
                </div>
            </div>

            <div class="action-buttons" style="margin-top: 30px; display: flex; flex-direction: column; gap: 10px;">
                <button id="save-profile-btn" class="nav-btn primary-btn">
                    <span>儲存所有修改</span>
                </button>
                
                <div style="display: flex; gap: 10px;">
                    <button id="logout-btn" class="nav-btn" style="background: rgba(255, 50, 50, 0.2); flex: 1;">
                        <span>登出帳號</span>
                    </button>
                    <button onclick="location.href='/'" class="nav-btn" style="flex: 1;">
                        <span>回到首頁</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="/js/main.js"></script>
</body>
</html>
